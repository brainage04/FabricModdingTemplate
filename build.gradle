plugins {
	id 'maven-publish'
	id 'io.github.brainage04.fabric-mod-conventions' version "${fabricmoddingconventions_version}"
	id 'io.github.brainage04.client-gametest-recorder' version "${fabricmoddingconventions_version}"
	id 'io.github.brainage04.production-gametests' version "${fabricmoddingconventions_version}"
	id 'io.github.brainage04.workspace-dependencies' version "${fabricmoddingconventions_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenLocal()

	// DevAuth
	maven { url = "https://pkgs.dev.azure.com/djtheredstoner/DevAuth/_packaging/public/maven/v1" }

	// ModMenu
	maven { url "https://api.modrinth.com/maven/" }

	// Fzzy Config
	maven { url = "https://maven.fzzyhmstrs.me/" }
}

workspaceDependencies {
	siblingMaven("FabricModdingConventions") {
		coordinate.set("io.github.brainage04:fabricmoddingconventions:${project.fabricmoddingconventions_version}")
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"

	// DevAuth
	runtimeOnly("me.djtheredstoner:DevAuth-fabric:1.2.2")

	// ModMenu
	implementation "maven.modrinth:modmenu:${project.modmenu_version}"

	// Fzzy Config
	implementation("me.fzzyhmstrs:fzzy_config:${project.fzzy_config_version}") {
		exclude group: "com.terraformersmc", module: "modmenu"
	}

	// FabricModdingConventions
	implementation "io.github.brainage04:fabricmoddingconventions:${project.fabricmoddingconventions_version}"
}

loom {
	splitEnvironmentSourceSets()

	mods {
		fabricmoddingtemplate {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	accessWidenerPath = file("src/main/resources/fabricmoddingtemplate.accesswidener")
}

fabricApi {
	configureTests {
		createSourceSet = true
		modId = "${project.mod_id}-gametest"
		enableGameTests = true
		enableClientGameTests = true
		eula = true
	}
}

productionGameTests {
	enabled = true
	runtimeModDependencies.add("me.fzzyhmstrs:fzzy_config:${project.fzzy_config_version}")
}

tasks.named("processGametestResources") {
	inputs.property "mod_id", project.properties.mod_id
	inputs.property "mod_version", project.version
	inputs.property "mod_name", project.properties.mod_name

	filesMatching("fabric.mod.json") {
		expand([
				"mod_id": inputs.properties.mod_id,
				"mod_version": inputs.properties.mod_version,
				"mod_name": inputs.properties.mod_name,
		])
	}
}


clientGameTestRecorder {
	fullscreen.set("false")
	guiScale.set("3")
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
}

test {
	useJUnitPlatform()
	systemProperty "fabric.side", "server"
}
