name: Initialize Template Repo
on:
  - push

permissions:
  contents: write

jobs:
  cleanup:
    name: "Initialize template repository"
    runs-on: ubuntu-24.04
    if: ${{ !github.event.repository.is_template }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.1.1
      - name: Install init tools
        run: |
          sudo apt-get update
          sudo apt-get install -y perl
      - name: Initialize Repo
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          owner=$(echo "$GITHUB_REPOSITORY" | cut -d/ -f1)
          mod_name=$(echo "$GITHUB_REPOSITORY" | cut -d/ -f2)
          ./init.sh --side=both "$owner" "$mod_name"
          
          git add .
          git commit -F- <<EOF
          Initialize template repository
          
          Set owner to $owner
          Set mod name to $mod_name
          Set mod side to both
          EOF
      - name: Push changes
        uses: ad-m/github-push-action@v0.8.0
        with:
          branch: ${{ github.ref }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
