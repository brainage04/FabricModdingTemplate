name: release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: setup jdk
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'

      - name: setup gradle
        uses: gradle/actions/setup-gradle@v4

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: verify tag matches mod version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          VERSION="$(grep '^mod_version=' gradle.properties | cut -d= -f2)"
          if [ "v${VERSION}" != "${TAG_NAME}" ]; then
            echo "Expected tag v${VERSION}, got ${TAG_NAME}"
            exit 1
          fi

      - name: build
        run: ./gradlew clean build

      - name: collect release artifacts
        run: |
          mkdir -p release-artifacts
          cp build/libs/*.jar release-artifacts/
          rm -f release-artifacts/*-dev.jar

      - name: read release notes from tag annotation
        id: notes
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          NOTES="$(git tag -l --format='%(contents)' "${TAG_NAME}")"

          {
            echo 'body<<EOF'
            printf '%s\n' "$NOTES"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*.jar
          body: ${{ steps.notes.outputs.body }}
          generate_release_notes: ${{ steps.notes.outputs.body == '' }}
          prerelease: ${{ contains(github.ref_name, '-') }}
